query GetClusterSnapshot($id: ID!) {
  _meta {
    block {
      number
    }
  }
  cluster(id: $id) {
    active
    validatorCount
    balance
    index
    networkFeeIndex
    effectiveBalance
  }
}

query GetCluster($id: ID!) {
  _meta {
    block {
      number
    }
  }
  cluster(id: $id) {
    owner {
      id
    }
    feeAsset
    active
    validatorCount
    balance
    index
    networkFeeIndex
    operatorIds
    effectiveBalance
  }
}

query GetClusters($owner: String!) {
  _meta {
    block {
      number
    }
  }
  clusters(where: { owner: $owner }) {
    id
    feeAsset
    active
    validatorCount
    balance
    index
    networkFeeIndex
    operatorIds
    effectiveBalance
  }
}

query GetOwnerNonce($owner: ID!) {
  _meta {
    block {
      number
    }
  }
  account(id: $owner) {
    nonce
  }
}

query GetOwnerNonceByBlock($owner: ID!, $block: Int) {
  account(id: $owner, block: { number: $block }) {
    nonce
  }
}

query GetOperator($id: ID!) {
  _meta {
    block {
      number
    }
  }
  operator(id: $id) {
    id
    publicKey
    validatorCount
    isPrivate
    whitelistedContract
    whitelisted {
      id
    }
  }
}

query GetOperators($operatorIds: [String!]!) {
  _meta {
    block {
      number
    }
  }
  operators(where: { id_in: $operatorIds }) {
    id
    publicKey
    validatorCount
    isPrivate
    whitelistedContract
    fee
    feeSSV
    whitelisted {
      id
    }
  }
}

query GetValidators($ids: [Bytes!]!) {
  _meta {
    block {
      number
    }
  }
  validators(where: { id_in: $ids }) {
    id
  }
}

query GetValidator($id: ID!) {
  _meta {
    block {
      number
    }
  }
  validator(id: $id) {
    id
  }
}

query GetClusterBalance(
  $clusterId: ID!
  $daoAddress: ID!
  $operatorIds: [String!]!
) {
  _meta {
    block {
      number
    }
  }
  daovalues(id: $daoAddress) {
    networkFee
    networkFeeIndex
    networkFeeIndexBlockNumber
    networkFeeSSV
    networkFeeIndexSSV
    networkFeeIndexBlockNumberSSV
    liquidationThreshold
    liquidationThresholdSSV
    minimumLiquidationCollateral
    minimumLiquidationCollateralSSV
  }
  operators(where: { id_in: $operatorIds }) {
    fee
    feeIndex
    feeIndexBlockNumber
    feeSSV
    feeIndexSSV
    feeIndexBlockNumberSSV
  }
  cluster(id: $clusterId) {
    feeAsset
    validatorCount
    networkFeeIndex
    index
    balance
    effectiveBalance
  }
}

query GetDaoValues($daoAddress: ID!) {
  _meta {
    block {
      number
    }
  }
  daovalues(id: $daoAddress) {
    networkFee
    networkFeeIndex
    networkFeeIndexBlockNumber
    networkFeeSSV
    networkFeeIndexSSV
    networkFeeIndexBlockNumberSSV
    liquidationThreshold
    liquidationThresholdSSV
    minimumLiquidationCollateral
    minimumLiquidationCollateralSSV
  }
}
